<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Her Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1420;
    --bg-2: #241A2C;
    --card: #2A1F33;
    --ink: #F2E9E4;
    --ink-dim: #C9B8C4;
    --amber: #E8A87C;
    --lavender: #A48FC7;
    --line: rgba(242,233,228,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(164,143,199,0.20), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(232,168,124,0.12), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Sora', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  .app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    height:100vh;
    padding:20px 18px 16px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand .name{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:500;
  }
  .mood-badge{
    font-size:11px;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--amber);
    background:var(--card);
  }

  .lang-toggle{ display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .lang-pill{
    font-size:11.5px; padding:5px 12px; border-radius:20px;
    border:1px solid var(--line); color:var(--ink-dim); cursor:pointer; background:var(--card);
  }
  .lang-pill.active{ color:#1B1420; background:var(--amber); border-color:var(--amber); font-weight:600; }

  .messages{
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:6px 2px 12px;
  }
  .msg{
    max-width:82%; padding:11px 14px; border-radius:16px; font-size:14.5px; line-height:1.5; white-space:pre-wrap;
  }
  .msg.assistant{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.user{ align-self:flex-end; background:linear-gradient(135deg, var(--lavender), #8C74B5); color:#1B1420; border-bottom-right-radius:5px; font-weight:500; }
  .msg.system{ align-self:center; font-size:12px; color:var(--ink-dim); background:transparent; padding:4px 10px; }
  .msg.typing{ align-self:flex-start; display:flex; gap:4px; padding:14px 16px; }
  .msg.typing span{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); animation: bounce 1.2s infinite ease-in-out; }
  .msg.typing span:nth-child(2){ animation-delay:.15s; }
  .msg.typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-4px); opacity:1;} }

  .composer{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:8px 8px 8px 16px;
  }
  .composer input{
    flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-family:'Sora', sans-serif; font-size:14.5px;
  }
  .composer input::placeholder{ color:var(--ink-dim); }

  .mic-btn{
    width:42px; height:42px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--amber), #D4875C); color:#221019;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition: transform .15s ease;
  }
  .mic-btn:active{ transform:scale(0.94); }
  .mic-btn.listening{ animation: pulse 1.4s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(232,168,124,0.55); }
    70%{ box-shadow: 0 0 0 14px rgba(232,168,124,0); }
    100%{ box-shadow: 0 0 0 0 rgba(232,168,124,0); }
  }
  .send-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:var(--lavender); color:#1B1420;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }

  .status-line{ text-align:center; font-size:11.5px; color:var(--ink-dim); padding:6px 0 2px; min-height:16px; }

  .hint-row{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-dim);
    padding-bottom:6px;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#E8A87C" stroke-width="1.5"/><path d="M8 13.5c1 1.2 2.4 1.8 4 1.8s3-.6 4-1.8" stroke="#E8A87C" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="9.5" r="1" fill="#E8A87C"/><circle cx="15" cy="9.5" r="1" fill="#E8A87C"/></svg>
      <span class="name">Bot Prana</span>
    </div>
    <div class="mood-badge" id="moodBadge">warm</div>
  </header>

  <div class="lang-toggle">
    <div class="lang-pill active" data-lang="ta-IN">தமிழ்</div>
    <div class="lang-pill" data-lang="en-US">English</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="status-line" id="statusLine">&nbsp;</div>
  <div class="hint-row">Try /funny · /serious · /flirty · /romantic to change the mood</div>

  <div class="composer">
    <input id="textInput" type="text" placeholder="பேசுங்க, அல்லது டைப் பண்ணுங்க…" />
    <button class="mic-btn" id="micBtn" title="Talk">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="send-btn" id="sendBtn" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20l16-8L4 4l0 6.5L15 12l-11 1.5L4 20z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('textInput');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const statusLine = document.getElementById('statusLine');
const moodBadge = document.getElementById('moodBadge');
const langPills = document.querySelectorAll('.lang-pill');

// Your voice endpoint — fixed, no settings screen needed.
const CLONE_ENDPOINT = 'https://her-xgd4.onrender.com/synthesize';

const MOODS = {
  funny:    { label: 'funny',    prompt: 'playful, joking, teases her lightly, makes her laugh' },
  serious:  { label: 'serious',  prompt: 'calm, direct, thoughtful, no jokes right now' },
  flirty:   { label: 'flirty',   prompt: 'flirty, teasing, a little bold, confident' },
  romantic: { label: 'romantic', prompt: 'soft, romantic, affectionate, tender' },
  warm:     { label: 'warm',     prompt: 'warm, caring, a little playful — the normal everyday mood' }
};

let state = {
  assistantName: 'Bot Prana',
  mood: 'warm',
  micLang: 'ta-IN',
  history: []
};

function currentPersonalityPrompt(){
  return MOODS[state.mood].prompt;
}

langPills.forEach(pill => {
  pill.onclick = () => {
    langPills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    state.micLang = pill.dataset.lang;
    if (recognition) recognition.lang = state.micLang;
  };
});

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTypingIndicator(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// Slash commands change mood locally — no need to call the brain for these.
const MOOD_COMMANDS = {
  '/funny': 'funny',
  '/serious': 'serious',
  '/flirty': 'flirty',
  '/romantic': 'romantic'
};

function tryHandleMoodCommand(rawText){
  const key = rawText.trim().toLowerCase();
  if (MOOD_COMMANDS[key]) {
    const mood = MOOD_COMMANDS[key];
    state.mood = mood;
    moodBadge.textContent = MOODS[mood].label;
    addMessage('system', `Mood switched to ${MOODS[mood].label}.`);
    return true;
  }
  return false;
}

async function getAssistantReply(userText){
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      history: state.history,
      userText,
      assistantName: state.assistantName,
      personality: currentPersonalityPrompt()
    })
  });
  const data = await response.json();
  if (!response.ok) {
    const errMsg = (data.error && (data.error.message || JSON.stringify(data.error))) || 'Request failed';
    throw new Error(errMsg);
  }
  const text = data.text || "Sorry, I didn't catch that.";
  state.history.push({ role: 'user', content: userText });
  state.history.push({ role: 'assistant', content: text });
  if (state.history.length > 20) state.history = state.history.slice(-20);
  return text;
}

async function speak(text){
  try {
    statusLine.textContent = 'Speaking in your cloned voice… (first message after a while may take ~30-50s to wake up)';
    const res = await fetch(CLONE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    if (!res.ok) throw new Error('Voice endpoint failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { statusLine.textContent = ''; };
    await audio.play();
  } catch (err) {
    statusLine.textContent = 'Voice unavailable right now — showing text only';
  }
}

async function handleUserText(userText){
  if (!userText || !userText.trim()) return;

  addMessage('user', userText);
  textInput.value = '';

  if (tryHandleMoodCommand(userText)) {
    return;
  }

  const typing = addTypingIndicator();
  statusLine.textContent = 'Thinking…';
  try {
    const reply = await getAssistantReply(userText);
    typing.remove();
    addMessage('assistant', reply);
    statusLine.textContent = '';
    speak(reply);
  } catch (err) {
    typing.remove();
    addMessage('assistant', `Something went wrong reaching the brain: ${err.message}`);
    statusLine.textContent = '';
  }
}

sendBtn.onclick = () => handleUserText(textInput.value);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleUserText(textInput.value);
});

let recognition = null;
let listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = state.micLang;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusLine.textContent = 'Listening…';
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    if (statusLine.textContent === 'Listening…') statusLine.textContent = '';
  };
  recognition.onerror = () => {
    listening = false;
    micBtn.classList.remove('listening');
    statusLine.textContent = 'Didn\'t catch that — try again';
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    handleUserText(transcript);
  };

  micBtn.onclick = () => {
    if (listening) { recognition.stop(); return; }
    recognition.lang = state.micLang;
    try { recognition.start(); } catch(e) {}
  };
} else {
  micBtn.onclick = () => {
    statusLine.textContent = 'Voice input isn\'t supported in this browser — try Chrome';
  };
}

addMessage('assistant', `Hi, I'm ${state.assistantName}, thangam. Talk to me, or type below.`);
</script>
</body>
</html>
